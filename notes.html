<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Notes</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161923;
    --border: #262b3a;
    --text: #dbe1ea;
    --muted: #8b93a7;
    --accent: #ff8c5a;
    --accent-soft: rgba(255,140,90,0.12);
    --code-bg: #1c2030;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  nav#toc {
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  nav#toc h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 16px;
  }
  nav#toc a {
    display: block;
    color: var(--muted);
    text-decoration: none;
    font-size: 13.5px;
    padding: 6px 10px;
    border-radius: 6px;
    margin-bottom: 2px;
    line-height: 1.4;
  }
  nav#toc a:hover { background: var(--accent-soft); color: var(--text); }
  main {
    padding: 48px 56px 120px;
    max-width: 860px;
  }
  #content h1 {
    font-size: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-top: 0;
  }
  #content h2 {
    font-size: 22px;
    margin-top: 48px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  #content h2 > a, #content h3 > a { color: inherit; text-decoration: none; }
  #content h3 { font-size: 17px; margin-top: 30px; color: var(--accent); }
  #content h4 { font-size: 14.5px; margin-top: 22px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;}
  #content p, #content li { font-size: 15px; line-height: 1.7; color: var(--text); }
  #content code {
    background: var(--code-bg);
    color: #ffb08a;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
  }
  #content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    overflow-x: auto;
  }
  #content pre code {
    background: none;
    padding: 0;
    color: #d9dee8;
  }
  #content table {
    border-collapse: collapse;
    width: 100%;
    margin: 18px 0;
    font-size: 13.5px;
  }
  #content th, #content td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  #content th { background: var(--panel); color: var(--accent); }
  #content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  #content blockquote {
    border-left: 3px solid var(--accent);
    margin: 16px 0;
    padding: 4px 16px;
    color: var(--muted);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
  }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
  #content a { color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    nav#toc { display: none; }
    main { padding: 28px 20px 80px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="toc"><h2>Contents</h2><div id="toc-list"></div></nav>
  <main><article id="content">Loading…</article></main>
</div>

<script>
  
  const MARKDOWN_SOURCE = "# 4-Week Roadmap (Weeks 1-4)\n\n## Mission\n- Become interview-ready for Java backend roles.\n- Build AI foundations.\n- Prepare for Germany steadily.\n- Build one production-grade AI project.\n\n## Daily Routine (Mon-Thu)\n- DSA: 60 min\n- Java/Spring: 45 min\n- AI/Python or Project: 45 min\n- German: 20-30 min\n\nFriday:\n- Review + German (light)\n\nSaturday:\n- 2h AI Project\n- 1h System Design\n- 1h AI learning\n\nSunday:\n- Mock interview (1h)\n- Project (2h)\n- Weekly review (30m)\n\n---\n\n# Week 1\n\n## Monday\n- DSA: Arrays (2 LC)\n- Java: ArrayList vs LinkedList\n- Python: Variables, loops\n- Project: Create Git repo & Spring Boot skeleton\n\n## Tuesday\n- DSA: HashMap (2 LC)\n- Java: HashMap internals\n- Python: Functions\n- German\n\n## Wednesday\n- DSA: Sliding Window (2 LC)\n- Java: Collections overview\n- Project: Authentication module\n\n## Thursday\n- DSA: Two Pointers (2 LC)\n- Spring Boot: REST Controllers\n- Python: OOP basics\n\n## Friday\n- Revise week\n- German\n- Read 20 pages\n\n## Saturday\n- System Design: URL Shortener basics\n- Project: Login & JWT\n\n## Sunday\n- Mock interview\n- Weekly reflection\n- Push code to GitHub\n\n---\n\n# Week 2\n\nFocus:\n- Strings\n- Stack\n- Queue\n- Java Generics\n- Spring Data JPA\n- NumPy basics\n- Project: User profile + DB\n\n---\n\n# Week 3\n\nFocus:\n- Trees (BFS/DFS)\n- JVM Memory\n- Streams API\n- Pandas\n- OpenAI API integration\n- Project: Chat interface\n\n---\n\n# Week 4\n\nFocus:\n- Binary Search\n- Recursion\n- Spring Security\n- Basic ML (scikit-learn intro)\n- Project: Conversation history\n\n---\n\n# Monthly Targets\n\n- 50 LeetCode problems\n- 20 GitHub commits\n- 1 AI project with auth + chat foundation\n- Python basics complete\n- German: 20 study sessions\n- 4 System Design topics\n\n# Monthly Review Template\n\n| Metric | Target | Actual |\n|---|---:|---:|\n| LeetCode | 50 | |\n| Java Topics | 8 | |\n| Spring Topics | 4 | |\n| AI Topics | 8 | |\n| GitHub Commits | 20 | |\n| Project Features | 4 | |\n| German Sessions | 20 | |\n| Mock Interviews | 4 | |\n\nNotes:\n- Wins:\n- Challenges:\n- Changes for next month:\n";
  const contentEl = document.getElementById('content');
  const tocList = document.getElementById('toc-list');

  function renderMarkdown(source) {
    if (window.marked && typeof marked.parse === 'function') {
      marked.setOptions({ gfm: true, breaks: true });
      return marked.parse(source);
    }

    return `<pre>${source.replace(/[&<>]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]))}</pre>`;
  }

  function buildToc() {
    tocList.innerHTML = '';
    const headings = contentEl.querySelectorAll('h2');

    headings.forEach((heading) => {
      const text = heading.textContent.trim();
      const slug = text.toLowerCase().replace(/[^\w]+/g, '-').replace(/^-+|-+$/g, '');
      heading.id = slug;

      const link = document.createElement('a');
      link.href = `#${slug}`;
      link.textContent = text;
      tocList.appendChild(link);
    });
  }

  contentEl.innerHTML = renderMarkdown(MARKDOWN_SOURCE);
  buildToc();
</script>
</body>
</html>
