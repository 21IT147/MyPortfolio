<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161923;
    --border: #262b3a;
    --text: #dbe1ea;
    --muted: #8b93a7;
    --accent: #ff8c5a;
    --accent-soft: rgba(255,140,90,0.12);
    --code-bg: #1c2030;
    --danger: #ff6b6b;
    --danger-soft: rgba(255,107,107,0.1);
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }
  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  nav#sidebar {
    border-right: 1px solid var(--border);
    padding: 28px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  nav#sidebar h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 14px;
  }
  #doc-list { margin-bottom: 30px; }
  #doc-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 8px;
    margin-bottom: 3px;
    cursor: pointer;
    font-family: var(--sans);
  }
  #doc-list button:hover { background: var(--accent-soft); color: var(--text); }
  #doc-list button.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  #toc-list a {
    display: block;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    margin-bottom: 2px;
    line-height: 1.4;
  }
  #toc-list a:hover { background: var(--accent-soft); color: var(--text); }
  main {
    padding: 48px 56px 120px;
    max-width: 860px;
  }
  #status {
    display: none;
    font-size: 14px;
    color: var(--muted);
    padding: 12px 0;
  }
  #error-box {
    display: none;
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  #error-box code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
  }
  #content h1 {
    font-size: 30px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    margin-top: 0;
  }
  #content h2 {
    font-size: 22px;
    margin-top: 48px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  #content h3 { font-size: 17px; margin-top: 30px; color: var(--accent); }
  #content h4 { font-size: 14.5px; margin-top: 22px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;}
  #content p, #content li { font-size: 15px; line-height: 1.7; color: var(--text); }
  #content code {
    background: var(--code-bg);
    color: #ffb08a;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
  }
  #content pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    overflow-x: auto;
  }
  #content pre code { background: none; padding: 0; color: #d9dee8; }
  #content table { border-collapse: collapse; width: 100%; margin: 18px 0; font-size: 13.5px; }
  #content th, #content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  #content th { background: var(--panel); color: var(--accent); }
  #content tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  #content blockquote {
    border-left: 3px solid var(--accent);
    margin: 16px 0;
    padding: 4px 16px;
    color: var(--muted);
    background: var(--accent-soft);
    border-radius: 0 8px 8px 0;
  }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 40px 0; }
  #content a { color: var(--accent); }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    nav#sidebar { position: static; height: auto; }
    main { padding: 28px 20px 80px; }
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="sidebar">
    <h2>Documents</h2>
    <div id="doc-list"></div>
    <h2>On this page</h2>
    <div id="toc-list"></div>
  </nav>
  <main>
    <div id="status">Loading…</div>
    <div id="error-box"></div>
    <article id="content"></article>
  </main>
</div>

<script>
  // -----------------------------------------------------------------
  // 1. Register every markdown file here: { slug, label, path }
  //    "path" is relative to THIS html file's location on the server.
  //    Adjust these paths to match your actual folder structure.
  // -----------------------------------------------------------------
  const DOCS = [
    { slug: "java-notes",       label: "Java Notes",        path: "assets/docs/java-notes.md" },
    { slug: "java-basics",      label: "Java Basics",       path: "assets/docs/java-basics.md" },
    { slug: "java-keywords",    label: "Java Keywords",     path: "assets/docs/java-keywords.md" },
    { slug: "list-of-keywords", label: "List of Keywords",  path: "assets/docs/list-of-keywords.md" },
  ];

  const docListEl = document.getElementById('doc-list');
  const tocListEl = document.getElementById('toc-list');
  const contentEl = document.getElementById('content');
  const statusEl  = document.getElementById('status');
  const errorEl   = document.getElementById('error-box');

  function slugify(text) {
    return text.toLowerCase()
      .replace(/[^\w\s-]/g, '')
      .trim()
      .replace(/\s+/g, '-');
  }

  function buildDocList(activeSlug) {
    docListEl.innerHTML = '';
    DOCS.forEach(doc => {
      const btn = document.createElement('button');
      btn.textContent = doc.label;
      btn.className = doc.slug === activeSlug ? 'active' : '';
      btn.addEventListener('click', () => loadDoc(doc.slug, true));
      docListEl.appendChild(btn);
    });
  }

  function buildToc() {
    tocListEl.innerHTML = '';
    const used = {};
    contentEl.querySelectorAll('h2').forEach(h2 => {
      let slug = slugify(h2.textContent);
      if (used[slug] !== undefined) {
        used[slug]++;
        slug = slug + '-' + used[slug];
      } else {
        used[slug] = 0;
      }
      h2.id = slug;
      const a = document.createElement('a');
      a.href = '#' + slug;
      a.textContent = h2.textContent;
      tocListEl.appendChild(a);
    });
  }

  async function loadDoc(slug, pushState) {
    const doc = DOCS.find(d => d.slug === slug) || DOCS[0];

    buildDocList(doc.slug);
    errorEl.style.display = 'none';
    statusEl.style.display = 'block';
    contentEl.innerHTML = '';
    tocListEl.innerHTML = '';

    if (pushState) {
      const url = new URL(window.location);
      url.searchParams.set('doc', doc.slug);
      window.history.pushState({}, '', url);
    }

    try {
      const res = await fetch(doc.path, { cache: 'no-store' });
      if (!res.ok) {
        throw new Error(`Server responded with ${res.status} ${res.statusText}`);
      }
      const markdown = await res.text();
      statusEl.style.display = 'none';
      contentEl.innerHTML = marked.parse(markdown);
      buildToc();
      document.title = doc.label;
    } catch (err) {
      statusEl.style.display = 'none';
      errorEl.style.display = 'block';
      errorEl.innerHTML = `
        <strong>Couldn't load "${doc.label}".</strong><br><br>
        Tried to fetch: <code>${doc.path}</code><br><br>
        This usually means the file isn't at that path relative to this HTML file's
        location on the deployed site, it wasn't committed/pushed, or the deployment
        hasn't picked it up yet. Error detail: <code>${err.message}</code>
      `;
    }
  }

  // Pick initial doc from ?doc=slug in the URL, else default to the first one
  const params = new URLSearchParams(window.location.search);
  const initialSlug = params.get('doc') || DOCS[0].slug;
  loadDoc(initialSlug, false);

  // Support browser back/forward buttons
  window.addEventListener('popstate', () => {
    const p = new URLSearchParams(window.location.search);
    loadDoc(p.get('doc') || DOCS[0].slug, false);
  });
</script>
</body>
</html>
